# yaml-language-server: $schema=../../../static/rule-schema.json
id: cd85a34f-d293-440b-8a84-709810e394b2
name: "BB:FW - Web Server Scanner"
description: |
  A source IP sending recon or suspicious traffic on Web Server ports to more than 400 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: Web Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 400
    distinct: destination IP
    within: 10
    unit: minutes
