# yaml-language-server: $schema=../../../static/rule-schema.json
id: a953fbee-1f0f-495d-92f8-c8349e40b1e9
name: "BB:FW - Proxy Server Scanner"
description: |
  A source IP sending recon or suspicious traffic on Proxy Server ports to more than 59 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: Proxy Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 59
    distinct: destination IP
    within: 10
    unit: minutes
