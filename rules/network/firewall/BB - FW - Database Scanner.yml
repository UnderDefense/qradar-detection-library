# yaml-language-server: $schema=../../../static/rule-schema.json
id: 6d0fc3b9-e213-402b-824f-26914ce9746e
name: "BB:FW - Database Scanner"
description: |
  A source IP sending recon or suspicious traffic on Database ports to more than 29 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: Database Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 29
    distinct: destination IP
    within: 10
    unit: minutes
