# yaml-language-server: $schema=../../../static/rule-schema.json
id: bb5977ca-7d5e-4b72-bd2b-5dca58d85b2e
name: "BB:FW - P2P Server Scanner"
description: |
  A source IP sending recon or suspicious traffic on P2P Server ports to more than 59 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: P2P Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 59
    distinct: destination IP
    within: 10
    unit: minutes
