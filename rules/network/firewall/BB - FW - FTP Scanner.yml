# yaml-language-server: $schema=../../../static/rule-schema.json
id: 1a246d8e-6408-4fee-8a95-3defd5053486
name: "BB:FW - FTP Scanner"
description: |
  A source IP sending recon or suspicious traffic on FTP ports to more than 29 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: FTP Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 29
    distinct: destination IP
    within: 10
    unit: minutes
