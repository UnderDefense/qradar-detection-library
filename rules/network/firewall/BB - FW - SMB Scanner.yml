# yaml-language-server: $schema=../../../static/rule-schema.json
id: 1a8f9801-6cb0-4308-9c40-9f31ec48f760
name: "BB:FW - SMB Scanner"
description: |
  A source IP sending recon or suspicious traffic on SMB ports (139, 445) to more than 30 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: network
    type: destination_port
    ports: [139, 445]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 30
    distinct: destination IP
    within: 10
    unit: minutes
