# yaml-language-server: $schema=../../../static/rule-schema.json
id: 27a82270-644a-4186-9b45-41522532249f
name: "BB:FW - Windows Server Scanner"
description: |
  A source IP sending recon or suspicious traffic on Windows Server ports to more than 200 destination IPs
  within 20 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: Windows Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 200
    distinct: destination IP
    within: 20
    unit: minutes
