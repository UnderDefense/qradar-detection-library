# yaml-language-server: $schema=../../../static/rule-schema.json
id: dc5ead8d-c776-45ce-a188-2c4ae86613ab
name: "BB:FW - RPC Server Scanner"
description: |
  A source IP sending recon or suspicious traffic on RPC Server ports to more than 59 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: RPC Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 59
    distinct: destination IP
    within: 10
    unit: minutes
