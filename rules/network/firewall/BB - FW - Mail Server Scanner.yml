# yaml-language-server: $schema=../../../static/rule-schema.json
id: 6bcaed4b-0417-4c66-8e8d-fd317294673f
name: "BB:FW - Mail Server Scanner"
description: |
  A source IP sending recon or suspicious traffic on Mail Server ports to more than 59 destination IPs
  within 10 minutes. No direction: rules add the context they need.
type: common
scope: local
building_block: true
groups:
  - UnderDefense.Firewall

tests:
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:PortDefinition: Mail Ports"]
  - group: function_counter
    type: rule_threshold
    rules: ["BB:CategoryDefinition: Recon Events", "BB:CategoryDefinition: Suspicious Events"]
    same: source IP
    times: 5
    across: 59
    distinct: destination IP
    within: 10
    unit: minutes
