# yaml-language-server: $schema=../../../static/rule-schema.json
id: cca691c0-fc34-436e-ade0-503ead20bf83
name: Windows - Credential Dumping via Registry
description: |
  This rule triggers when credential dumping activities are detected in Windows registry. Adversaries
  may query the registry looking for credentials and passwords that have been stored for use by other
  programs or services and exploit those credentials.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Windows
mitre:
  - T1003.002
  - T1552.002

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: event
    type: category
    categories:
      - { high: Audit, low: Object Access Success }
      - { high: System, low: Process Creation Success }
      - { high: Audit, low: Command Execution Success }
  - group: common
    type: search_filter
    filters:
      - property: Process Name (custom)
        operator: is_any_of
        values: [reg.exe, regedit.exe, regedt32.exe]
  - group: common
    type: aql
    filter: >-
      LOWER("Command") MATCHES '.*?reg(\.exe)?\"?\s+(add|query|save).*(uselogoncredential|password|sam|system|security).*'
      OR LOWER("Registry Key") MATCHES '.*\\system\\(controlset001|controlset002|currentcontrolset).*wdigest.*'
  # HP patch monitoring task.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Parent Process Path (custom)
        operator: is_any_of
        values: ['C:\Windows\System32\cmd.exe']
      - property: Process Path (custom)
        operator: is_any_of
        values: ['C:\Windows\System32\reg.exe']
      - property: Parent Command (custom)
        operator: contains_any_of
        values: [hpatchmonTask.cmd]
  # Trend Micro agent installer.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Parent Process Name (custom)
        operator: matches_any_of
        values: ['TMServerAgent_Windows_Server_.*_Offline\.exe']
      - property: Command (custom)
        operator: contains_any_of
        values: ['TrendMicro\TMSecurityService']
  # Trend Micro agent.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Parent Process Name (custom)
        operator: is_any_of
        values: [TM.exe]
      - property: Command (custom)
        operator: contains_any_of
        values: ['TrendMicro\TMSecurityService']
  # Microsoft Defender for Servers (MDE extension for Azure VMs).
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Parent Process Path (custom)
        operator: is_any_of
        values: ['C:\Windows\System32\cmd.exe']
      - property: Parent Command (custom)
        operator: contains_any_of
        values: ['\Microsoft.Azure.AzureDefenderForServers.MDE.Windows\']

action:
  severity: { set: 7 }
  offense:
    index_on: Machine Identifier (custom)
    new_offense: true
    annotate: Windows - Credential Dumping via Registry

response:
  new_event:
    name: Windows - Credential Dumping via Registry
    description: >-
      Detects when Windows registry is scanned or passwords are dumped for credentials.
    severity: 7
    credibility: 10
    relevance: 10
    high_cat: Exploit
    low_cat: Password Guess/Retrieve
    annotate: Windows - Credential Dumping via Registry
    offense:
      index_on: Machine Identifier (custom)
      new_offense: true
