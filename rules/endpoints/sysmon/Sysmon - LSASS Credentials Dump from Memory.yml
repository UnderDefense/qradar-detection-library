# yaml-language-server: $schema=../../../static/rule-schema.json
id: c53dac69-819e-4616-bdf4-67123182d986
name: Sysmon - LSASS Credentials Dump from Memory
description: |
  Detects attempt to access credential material stored in the process memory of the Local Security
  Authority Subsystem Service (LSASS). This is done by accessing and dumping the LSASS memory for
  further analysis.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Sysmon
mitre:
  - T1003.001

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: common
    type: search_filter
    filters:
      - property: Event Category
        operator: is_any_of
        values: [Microsoft-Windows-Sysmon/Operational]
  - group: common
    type: search_filter
    filters:
      - property: Event ID
        operator: is_any_of
        values: [10] # Process accessed
  - group: common
    type: search_filter
    filters:
      - property: Target Process Name (custom)
        operator: is_any_of
        values: [lsass.exe]
  - group: common
    type: search_filter
    filters:
      - property: Granted Access (custom)
        operator: contains_any_of
        # always quote: unquoted 0x... is an integer in YAML
        values: ['0x1010', '0x1438', '0x143a', '0x1f1fff', '0x1fffff']
  # Microsoft Defender scanning LSASS.
  - group: common
    type: search_filter
    filters:
      - property: Process Path (custom)
        operator: not_matches_any_of
        values: ['(?i)^C:\\(ProgramData\\Microsoft|Program Files)\\Windows Defender\\(Platform\\[^\\]+\\)?MsMpEng\.exe$']
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Process Path (custom)
        operator: matches_any_of
        values: ['(?i)^C:\\Windows\\system32\\(csrss|wininit)\.exe$']
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Process Name (custom)
        operator: is_any_of
        values: [perfmon.exe]
      - property: Process Path (custom)
        operator: is_any_of
        values: ['C:\Windows\System32\perfmon.exe']

action:
  severity: { set: 7 }
  offense:
    index_on: Machine Identifier (custom)
    new_offense: true
    annotate: Sysmon - LSASS Credentials Dump from Memory

response:
  new_event:
    name: Sysmon - LSASS Credentials Dump from Memory
    description: >-
      Detects attempt to access credential material stored in the process memory of the Local Security
      Authority Subsystem Service (LSASS). This is done by accessing and dumping the LSASS memory for
      further analysis.
    severity: 7
    credibility: 10
    relevance: 10
    high_cat: Suspicious Activity
    low_cat: Suspicious Windows Events
    annotate: Sysmon - LSASS Credentials Dump from Memory
    offense:
      index_on: Machine Identifier (custom)
      new_offense: true
