# yaml-language-server: $schema=../../../static/rule-schema.json
id: 6b1162d7-c888-49ec-8e37-f3de019d00b8
name: Sysmon - Mshta.exe Suspicious File Load
description: |
  Detects execution of mshta.exe which may be abused to proxy execution of malicious .hta files and
  JScript or VBScript through a trusted Windows utility. Nowadays, .hta files are rarely used for
  legitimate purposes and any mshta.exe execution might be an indicator of phishing or malware
  infection.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Sysmon
mitre:
  - T1218.005

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: common
    type: search_filter
    filters:
      - property: Event Category
        operator: is_any_of
        values: [Microsoft-Windows-Sysmon/Operational]
  - group: common
    type: search_filter
    filters:
      - property: Event ID
        operator: is_any_of
        values: [1] # Process Create
  # Original Filename also catches the SysWOW64 copy and renamed copies of mshta.exe.
  - group: common
    type: aql
    filter: LOWER("Original Filename") = 'mshta.exe'

action:
  severity: { set: 4 }
  offense:
    index_on: Machine Identifier (custom)
    new_offense: true
    annotate: Sysmon - Mshta.exe Suspicious File Load

response:
  new_event:
    name: Sysmon - Mshta.exe Suspicious File Load
    description: >-
      Detects execution of mshta.exe which may be abused to proxy execution of malicious .hta files and
      JScript or VBScript through a trusted Windows utility. Nowadays, .hta files are rarely used for
      legitimate purposes and any mshta.exe execution might be an indicator of phishing or malware
      infection.
    severity: 4
    credibility: 10
    relevance: 10
    high_cat: Suspicious Activity
    low_cat: Suspicious Windows Events
    annotate: Sysmon - Mshta.exe Suspicious File Load
    offense:
      index_on: Machine Identifier (custom)
      new_offense: true
