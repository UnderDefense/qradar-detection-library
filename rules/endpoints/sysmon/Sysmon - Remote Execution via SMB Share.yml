# yaml-language-server: $schema=../../../static/rule-schema.json
id: 4f24ca83-efbe-40df-bd5d-4fd94c205b32
name: Sysmon - Remote Execution via SMB Share
description: |
  Detects remote execution via SMB admin shares using scripting interpreters, which is a technique
  commonly used by tools like SMBExec to proxy command execution on remote Windows systems without
  uploading a payload to the target.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Sysmon
mitre:
  - T1021.002

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: common
    type: search_filter
    filters:
      - property: Event Category
        operator: is_any_of
        values: [Microsoft-Windows-Sysmon/Operational]
  - group: common
    type: search_filter
    filters:
      - property: Event ID
        operator: is_any_of
        values: [1] # Process Create
      - property: Parent Process Name (custom)
        operator: is_any_of
        values: [cmd.exe, powershell.exe, cscript.exe, wscript.exe]
      - property: Command (custom)
        operator: matches_any_of
        values: ['(?i)\\\\.*\\C\$', '(?i)\\\\.*\\Admin\$']
  # Netwrix update checks run their scripts from the C$ share.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Command (custom)
        operator: matches_any_of
        values: ['(?i)\\\\.*?\\C\$\\Windows\\Temp\\.*\\(?:GetPendingUpdates|GetUpdateDates)\.vbs']

action:
  severity: { set: 4 }
  offense:
    index_on: Machine Identifier (custom)
    new_offense: true
    annotate: Sysmon - Remote Execution via SMB Share

response:
  new_event:
    name: Sysmon - Remote Execution via SMB Share
    description: >-
      Detects remote execution via SMB admin shares using scripting interpreters, which is a technique
      commonly used by tools like SMBExec to proxy command execution on remote Windows systems without
      uploading a payload to the target.
    severity: 4
    credibility: 10
    relevance: 10
    high_cat: Suspicious Activity
    low_cat: Potential SMB Vulnerability
    annotate: Sysmon - Remote Execution via SMB Share
    offense:
      index_on: Machine Identifier (custom)
      new_offense: true
