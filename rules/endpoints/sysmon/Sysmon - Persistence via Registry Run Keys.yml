# yaml-language-server: $schema=../../../static/rule-schema.json
id: 0f75fe4f-847f-4554-9c16-62ff5d1ae52d
name: Sysmon - Persistence via Registry Run Keys
description: |
  Detects Windows persistence achieved by adding a program to run keys in the Windows Registry.
  Adding an entry will cause the program referenced to be executed whenever a user logs in,
  potentially indicating automatic execution of a malicious payload.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Sysmon
mitre:
  - T1547.001

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: common
    type: search_filter
    filters:
      - property: Event Category
        operator: is_any_of
        values: [Microsoft-Windows-Sysmon/Operational]
  - group: common
    type: search_filter
    filters:
      - property: Target Object (custom)
        operator: contains_any_of
        values: ['\CurrentVersion\Run\', '\CurrentVersion\RunServices\', '\Policies\Explorer\Run\']
      - property: Event ID
        operator: is_any_of
        values: [13] # Registry value set
      - property: Registry Value Data (custom)
        operator: is_not_any_of
        values: [(Empty)]
  # Microsoft Edge auto launch.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Process Name (custom)
        operator: is_any_of
        values: [msedge.exe]
      - property: Registry Value Name (custom)
        operator: matches_any_of
        values: [MicrosoftEdgeAutoLaunch_.*]
  # OneDrive.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Registry Value Data (custom)
        operator: is_any_of
        values: ['"C:\Program Files\Microsoft OneDrive\OneDrive.exe" /background']
      - property: Registry Value Name (custom)
        operator: is_any_of
        values: [OneDrive]
      - property: Process Name (custom)
        operator: is_any_of
        values: [OneDriveSetup.exe, OneDrive.exe]
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Target Object (custom)
        operator: contains_any_of
        values: ['\Software\Microsoft\Windows\CurrentVersion\Run\OneDrive']
      - property: Process Name (custom)
        operator: is_any_of
        values: [OneDrive.exe]
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Registry Value Name (custom)
        operator: is_any_of
        values: [Microsoft.Lists]
      - property: Process Path (custom)
        operator: contains_any_of
        values: ['C:\Program Files\Microsoft OneDrive']
      - property: Process Name (custom)
        operator: contains_any_of
        values: [OneDriveSetup.exe, OneDrive.Sync.Service.exe]
  # Google Chrome auto launch.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Process Name (custom)
        operator: is_any_of
        values: [chrome.exe]
      - property: Registry Value Name (custom)
        operator: matches_any_of
        values: [GoogleChromeAutoLaunch_.*]
      - property: Registry Value Data (custom)
        operator: contains_any_of
        values: [--no-startup-window]
  # Trend Micro agent.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Registry Value Data (custom)
        operator: contains_any_of
        values: ['C:\Program Files (x86)\Trend Micro\Endpoint Basecamp']
  # VMware Tools.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Registry Value Data (custom)
        operator: contains_any_of
        values: ['C:\Program Files\VMware\VMware Tools\vmtoolsd.exe']
  # SCCM applying Group Policy.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Target Object (custom)
        operator: contains_any_of
        values: ['\Group Policy Objects\']
      - property: Process Name (custom)
        operator: is_any_of
        values: [CcmExec.exe]

action:
  severity: { set: 4 }
  offense:
    index_on: Machine Identifier (custom)
    new_offense: true
    annotate: Sysmon - Persistence via Registry Run Keys

response:
  new_event:
    name: Sysmon - Persistence via Registry Run Keys
    description: >-
      Detects Windows persistence achieved by adding a program to run keys in the Windows Registry.
      Adding an entry will cause the program referenced to be executed whenever a user logs in,
      potentially indicating automatic execution of a malicious payload.
    severity: 4
    credibility: 10
    relevance: 10
    high_cat: Suspicious Activity
    low_cat: Suspicious Windows Events
    annotate: Sysmon - Persistence via Registry Run Keys
    offense:
      index_on: Machine Identifier (custom)
      new_offense: true
