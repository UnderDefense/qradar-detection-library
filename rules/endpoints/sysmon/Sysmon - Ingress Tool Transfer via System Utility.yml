# yaml-language-server: $schema=../../../static/rule-schema.json
id: 2ab80588-1b7c-4c38-baac-2d145a904003
name: Sysmon - Ingress Tool Transfer via System Utility
description: |
  Detects transfer tools or other files from an external system into a compromised environment.
  This can be achieved using prebuilt Windows utilities like certutil, curl or bitsadmin that can
  download arbitrary files from external location without any prerequisites.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Sysmon
mitre:
  - T1105

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: common
    type: search_filter
    filters:
      - property: Event Category
        operator: is_any_of
        values: [Microsoft-Windows-Sysmon/Operational]
  - group: common
    type: search_filter
    filters:
      - property: Event ID
        operator: is_any_of
        values: [1] # Process Create
  - group: common
    type: aql
    filter: >-
      (LOWER("Original Filename") = 'certutil.exe' AND "Command" LIKE '% -f %')
      OR (LOWER("Original Filename") = 'curl.exe' AND "Command" LIKE '% -o %')
      OR (LOWER("Original Filename") = 'bitsadmin.exe'
      AND ("Command" LIKE '%/transfer%' OR "Command" LIKE '%/addfile%'))

action:
  severity: { set: 7 }
  offense:
    index_on: Machine Identifier (custom)
    new_offense: true
    annotate: Sysmon - Ingress Tool Transfer via System Utility

response:
  new_event:
    name: Sysmon - Ingress Tool Transfer via System Utility
    description: >-
      Detects transfer tools or other files from an external system into a compromised environment.
      This can be achieved using prebuilt Windows utilities like certutil, curl or bitsadmin that can
      download arbitrary files from external location without any prerequisites.
    severity: 7
    credibility: 10
    relevance: 10
    high_cat: Suspicious Activity
    low_cat: Suspicious Windows Events
    annotate: Sysmon - Ingress Tool Transfer via System Utility
    offense:
      index_on: Machine Identifier (custom)
      new_offense: true
