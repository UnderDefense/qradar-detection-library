# yaml-language-server: $schema=../../../static/rule-schema.json
id: 2cabbf82-e9b7-473c-8cd7-987442f65647
name: "BB:AD - Invalid Password at Login"
description: |
  Matches failed Windows logons caused by a wrong password (0xC000006A)
  or a non-existent user name (0xC0000064).
type: event
scope: local
building_block: true
groups:
  - UnderDefense.ActiveDirectory

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: event
    type: qid
    events: ["Failure Audit: An account failed to log on"]
  - group: common
    type: search_filter
    filters:
      - property: Extended Error Code (custom)
        operator: is_any_of
        values: ["0xC000006A", "0xC0000064"] # always quote: unquoted 0x... is an integer in YAML
  - group: common
    type: search_filter
    filters:
      - property: Username
        operator: is_not_na
