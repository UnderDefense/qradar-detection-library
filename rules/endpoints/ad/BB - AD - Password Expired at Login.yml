# yaml-language-server: $schema=../../../static/rule-schema.json
id: fbc8a631-3ea4-4d8c-826a-2c39da494357
name: "BB:AD - Password Expired at Login"
description: |
  Matches failed Windows logons because the account password has expired (0xC0000071).
type: event
scope: local
building_block: true
groups:
  - UnderDefense.ActiveDirectory

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Windows Security Event Log]
  - group: event
    type: qid
    events: ["An account failed to log on: Expired Password"]
  - group: common
    type: search_filter
    filters:
      - property: Username
        operator: is_not_na
  - group: common
    type: search_filter
    filters:
      - property: Extended Error Code (custom)
        operator: is_any_of
        values: ["0xC0000071"] # always quote: unquoted 0x... is an integer in YAML
