# yaml-language-server: $schema=../../../static/rule-schema.json
id: f4efe61d-96c7-4031-abb4-9ea1d0bd7d5c
name: O365 - Permission Grant to Azure Application
description: |
  Detects admin consent grants to Azure AD applications, specifically when permissions are granted
  on behalf of all users or with administrative consent context. Attackers may register malicious
  OAuth applications and trick administrators into granting broad permissions, enabling persistent
  access to Microsoft 365 data including emails, files, and contacts without requiring user
  credentials.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Office365
mitre:
  - T1528

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Office 365]
  - group: common
    type: search_filter
    filters:
      - property: Affected Workload (custom)
        operator: is_any_of
        values: [AzureActiveDirectory]
      - property: QID Number
        operator: is
        values: [101250890]
      - property: Payload Contains
        operator: is_any_of
        values:
          - '"Name":"ConsentContext.IsAdminConsent","NewValue":"True"'
          - '"Name":"ConsentContext.OnBehalfOfAll","NewValue":"True"'

action:
  severity: { set: 4 }
  offense:
    index_on: Username
    new_offense: true
    annotate: O365 - Permission Grant to Azure Application

response:
  new_event:
    name: O365 - Permission Grant to Azure Application
    description: >-
      Detects admin consent grants to Azure AD applications, specifically when permissions are granted
      on behalf of all users or with administrative consent context. Attackers may register malicious
      OAuth applications and trick administrators into granting broad permissions, enabling persistent
      access to Microsoft 365 data including emails, files, and contacts without requiring user
      credentials.
    severity: 4
    credibility: 10
    relevance: 10
    high_cat: Suspicious Activity
    low_cat: Suspicious Activity
    annotate: O365 - Permission Grant to Azure Application
    offense:
      index_on: Username
      new_offense: true
