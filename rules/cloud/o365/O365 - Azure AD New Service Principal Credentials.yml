# yaml-language-server: $schema=../../../static/rule-schema.json
id: 4694eb92-35b2-42c0-83ac-6e473dd26a3f
name: O365 - Azure AD New Service Principal Credentials
description: |
  Detects Adversaries may add a rogue secret or certificate to an existing application or service
  principal with granted permissions that allow the attacker to access data that is normally
  protected by MFA requirements.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.Office365
mitre:
  - T1098.001

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Office 365]
  - group: event
    type: qid
    events:
      - "Update application – Certificates and secrets management -success"
      - "Add service principal credentials-success"
  # Microsoft-managed service principals rotating their own credentials.
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Username
        operator: matches_any_of
        values: [ServicePrincipal_.+]
      - property: Payload Contains
        operator: is_any_of
        values: [ConnectSyncProvisioning, Managed Service Identity, Storage Resource Provider]

action:
  severity: { set: 2 }
  offense:
    index_on: Username
    new_offense: true
    annotate: O365 - Azure AD New Service Principal Credentials

response:
  new_event:
    name: O365 - Azure AD New Service Principal Credentials
    description: >-
      Detects Adversaries may add a rogue secret or certificate to an existing application or service
      principal with granted permissions that allow the attacker to access data that is normally
      protected by MFA requirements.
    severity: 2
    credibility: 8
    relevance: 8
    high_cat: Suspicious Activity
    low_cat: Suspicious Activity
    annotate: O365 - Azure AD New Service Principal Credentials
    offense:
      index_on: Username
      new_offense: true
