# yaml-language-server: $schema=../../../static/rule-schema.json
id: 16f34260-f39f-49e0-84c5-8ee24479be3f
name: "BB:EntraID - Password Spray IPv6"
description: |
  Failed Entra ID sign-ins from one IPv6 address against 10 or more different users in 20 minutes.
type: event
scope: local
building_block: true
groups:
  - UnderDefense.EntraID

tests:
  - group: common
    type: search_filter
    negate: true
    filters:
      - property: Source IPv6
        operator: is
        values: ['0:0:0:0:0:0:0:0']
  # Sign-in failures: wrong password, locked or disabled account, MFA required or failed, blocked by policy.
  - group: common
    type: search_filter
    filters:
      - property: Error Code (custom)
        operator: is_any_of
        values: [50126, 50053, 50055, 50056, 50057, 50059, 50064, 50072, 50074, 50076, 50079, 70011, 70008, 65001, 53003]
  - group: function_counter
    type: distinct_properties
    count: 10
    properties: [Source IPv6]
    distinct_properties: [Username]
    within: 20
    unit: minutes
