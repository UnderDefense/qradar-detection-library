# yaml-language-server: $schema=../../../static/rule-schema.json
id: 7e6e652a-d47b-4248-9ff7-5b4405787a51
name: EntraID - Password Spray Attack Detected
description: |
  This rule detects potential password spraying attempts against Microsoft Entra ID by identifying
  multiple failed authentication attempts from the same source IP address targeting different user
  accounts within a short time period. Identifies distributed authentication failures from a single
  source, which may indicate attempts to guess passwords across multiple accounts.
type: event
scope: local
enabled: true
groups:
  - UnderDefense.EntraID
mitre:
  - T1110.003

tests:
  - group: log_source
    type: log_source_type
    log_source_types: [Microsoft Entra ID]
  - group: function_simple
    type: rule
    match: any
    rules: ["BB:EntraID - Password Spray IPv4", "BB:EntraID - Password Spray IPv6"]

action:
  severity: { set: 4 }
  offense:
    index_on: Source IP
    new_offense: true
    annotate: EntraID - Password Spray Attack Detected

response:
  new_event:
    name: EntraID - Password Spray Attack Detected
    description: >-
      This rule detects potential password spraying attempts against Microsoft Entra ID by identifying
      multiple failed authentication attempts from the same source IP address targeting different user
      accounts within a short time period. Identifies distributed authentication failures from a single
      source, which may indicate attempts to guess passwords across multiple accounts.
    severity: 4
    credibility: 10
    relevance: 10
    high_cat: Authentication
    low_cat: Web Service Login Succeeded
    annotate: EntraID - Password Spray Attack Detected
    offense:
      index_on: Source IP
      new_offense: true

limiter:
  times: 20
  per_unit: 20
  unit: minutes
  per_property: Rule
