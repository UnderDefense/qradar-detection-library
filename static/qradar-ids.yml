# QRadar IDs and keys the extension builder needs, by the names the rules use.
# Only values that are the same on every QRadar console belong here. Sources:
#   log_source_types      GET /api/config/event_sources/log_source_management/log_source_types
#   low_level_categories  GET /api/data_classification/low_level_categories  (key: "High / Low")
#   everything else       IBM content extensions (Endpoint 3.1.0 and 3.3.0, Hybrid Cloud 2.3.2, Sysmon 1.3.2,
#                         Threat 3.1.0, Recon 1.0.3, Network Anomaly 1.1.1, Email 1.2.2,
#                         Container 1.1.4, Cryptomining 1.1.1, Data Exfiltration 1.0.5,
#                         Baseline Maintenance 1.1.0 and 2.2.6, Turla 1.1.1, Network Insights 1.6.0,
#                         Self Monitoring 2.2.2, GPG13 1.1.0, ISO 27001 1.1.4, UBA 5.0.1 and 5.1.0
#                         with its 12 bundled content packs, Threat Intelligence app 2.6.0,
#                         SOAR Plugin 5.x Content Pack 1.0.0), the console's system rules and
#                         Use Case Manager exports
log_source_types:
  Fortinet FortiGate Security Gateway: 73
  Microsoft Entra ID: 445
  Microsoft Office 365: 397
  Microsoft Windows Security Event Log: 12

low_level_categories:
  Access / Access Denied: 4015
