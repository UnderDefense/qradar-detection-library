# Offense types travel inside the extension. Import matches a custom one by property_name
# (the custom property identifier) and maps `id` to the console's own offense type.
# A rule limiter "per <name>" uses the same entry: its hostType is limiter_string.
offense_types:
  Source IP:
    {id: 0, database: common, legacy: true, nva_name: by-attacker, custom: false, name: BY_ATTACKER,
     limiter_string: ATTACKER, default_label: Source IP, property_name: sourceIP}
  Destination IP:
    {id: 1, database: common, legacy: true, nva_name: by-target, custom: false, name: BY_TARGET,
     limiter_string: TARGET, default_label: Destination IP, property_name: destinationIP}
  Username:
    {id: 3, database: events, legacy: true, nva_name: by-username, custom: false, name: BY_USERNAME,
     limiter_string: BY_USERNAME, default_label: Username, property_name: userName}
  Rule:
    {id: 14, database: common, legacy: true, nva_name: by-rule, custom: false, name: BY_RULE,
     limiter_string: ALL, default_label: Rule, property_name: partialOrMatchList}
  Machine Identifier (custom):
    {id: 51, database: events, legacy: false, nva_name: by-machine-id, custom: true, name: BY_REG_MACHINE_ID,
     limiter_string: MACHINEIDENTIFIER, default_label: Machine Identifier,
     property_name: 002a5618-8f44-41bc-b5aa-bc02153a7d84}


# Keys of standard (not "(custom)") properties. A custom property is referenced by its name
# without " (custom)". event_fields keys (UISemServices.getEventDatabaseFields) serve counters,
# regex and reference set tests and responses. Search filters use the same keys: every key seen
# in a search filter so far (userName, destinationIP, destinationPort, qidEventId,
# qidEventCategory, qidNumber, sourceGeographic, sourceIP, qid) is also an event field.
# Keys marked "search filter key" below are known only from search filter use.
properties:
  search_filter:
    Destination IP: destinationIP
    Destination Port: destinationPort
    Event Category: qidEventCategory
    Event ID: qidEventId
    # Values are QID numbers, which can be custom and differ per console: in the library,
    # match by name with an AQL test, QIDNAME(qid) IN ('...'), instead.
    Event Name: qid
    Payload Contains: payloadContains
    Payload Matches Regular Expression: payloadMatches
    Protocol: protocol
    QID Number: qidNumber
    Source Geographic Country/Region: sourceGeographic
    Source IP: sourceIP
    Source IPv6: sourcev6
    Source Port: sourcePort
    Username: userName
  event_fields:
    Destination IP: destinationIP
    Destination Port: destinationPort
    Event Category: qidEventCategory
    Event ID: qidEventId
    Event Name: qid
    QID Number: qidNumber
    Source Geographic Country/Region: sourceGeographic
    Source IP: sourceIP
    Source IPv6: sourcev6  # search filter key
    Source Port: sourcePort  # search filter key
    Source or Destination IP: sourceOrDestinationIPColumn
    Username: userName

# Reference set element_type by the type suffix the Rule Wizard shows: "<name> - <type>".
# The code is the position in the console's Type list; 0, 2, 3, 4 and 6 are also seen in exports.
reference_set_types:
  AlphaNumeric: 0
  Numeric: 1
  IP: 2
  Port: 3
  AlphaNumeric (Ignore Case): 4
  Date: 5
  CIDR: 6

# Reference set type in add/remove responses, by the same suffix.
reference_set_response_types:
  AlphaNumeric: ALN
  IP: IP
  AlphaNumeric (Ignore Case): ALNIC
  CIDR: CIDR

